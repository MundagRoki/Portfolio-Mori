<!doctype html><meta charset="utf-8"><body>
<video id="v" src="pour.mp4" muted playsinline preload="auto"></video>
<script>
/* The step 1 -> 2 pour (Kling, 1440 square, 193 frames): the pail lifts,
   the хөхүүр rises into frame, the pail pours, rises away, and the camera
   pushes in on the хөхүүр. Keyed off the white like the turntables, plus a
   warm-tint key for the milk (ivory on white: its blue dips below red and
   green, which the paper never does); edges of the frame fade out, since
   the camera moves and objects cross them. */
const v = document.getElementById('v'), FPS = 24;
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
let W, H, c, g;
async function frame(f) {
  await ready; if (!c) { W = v.videoWidth; H = v.videoHeight; c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d', { willReadFrequently: true }); }
  await seek((f + .5) / FPS); g.drawImage(v, 0, 0); return g.getImageData(0, 0, W, H);
}
const T0 = 190, T1 = 226, BG = 254;
/* box count of a mask over a (2r+1)^2 window, from an integral image */
function boxCount(mask, r) {
  const I = new Uint32Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let run = 0; for (let x = 0; x < W; x++) { run += mask[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + run; } }
  const out = new Uint32Array(W * H);
  for (let y = 0; y < H; y++) { const ya = Math.max(0, y - r), yb = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) { const xa = Math.max(0, x - r), xb = Math.min(W, x + r + 1);
      out[y * W + x] = I[yb * (W + 1) + xb] - I[ya * (W + 1) + xb] - I[yb * (W + 1) + xa] + I[ya * (W + 1) + xa]; } }
  return out;
}
function key(im, fade) {
  const d = im.data, out = new ImageData(W, H), o = out.data;
  /* the milk's white core: close the warm-milk mask (dilate, then erode) so a
     highlight running down the stream, too narrow to be paper, fills in */
  const R6 = 6, warmM = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) { const q = i * 4, R = d[q], G = d[q + 1], B = d[q + 2]; warmM[i] = ((R + G) / 2 - B >= 6 && Math.min(R, G, B) >= 170) ? 1 : 0; }
  const dil = boxCount(warmM, R6), dm = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) dm[i] = dil[i] > 0 ? 1 : 0;
  const ero = boxCount(dm, R6), full = (2 * R6 + 1) * (2 * R6 + 1), closed = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; const ya = Math.max(0, y - R6), yb = Math.min(H, y + R6 + 1), xa = Math.max(0, x - R6), xb = Math.min(W, x + R6 + 1);
    closed[i] = ero[i] >= (yb - ya) * (xb - xa) ? 1 : 0; }
  const alpha = new Float32Array(W * H), isMilk = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const q = (y * W + x) * 4, R = d[q], G = d[q + 1], B = d[q + 2], m = Math.min(R, G, B);
    const aw = m >= T1 ? 0 : m <= T0 ? 1 : (T1 - m) / (T1 - T0);
    const warm = (R + G) / 2 - B;
    let am = Math.max(0, Math.min(1, (warm - 5) / 12));                 /* the milk */
    if (closed[y * W + x] && m >= 170) am = 1;
    const i = y * W + x; alpha[i] = Math.max(aw, am); isMilk[i] = am >= aw ? 1 : 0;
  }
  /* milk shut inside the object (the pail's own, seen over its rim) is solid;
     paper shut in (under the rope's arc) is not: it is not warm */
  const seen = new Uint8Array(W * H), st = new Int32Array(W * H); let sp = 0;
  const cand = i => alpha[i] < .6;
  const push = i => { if (!seen[i] && cand(i)) { seen[i] = 1; st[sp++] = i; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); } for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (sp) { const i = st[--sp], x = i % W; if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < W * (H - 1)) push(i + W); }
  const comp = [];
  for (let i0 = 0; i0 < W * H; i0++) {
    if (seen[i0] || !cand(i0)) continue;
    comp.length = 0; seen[i0] = 2; st[0] = i0; sp = 1; let wsum = 0;
    while (sp) { const i = st[--sp], x = i % W; comp.push(i); const q = i * 4; wsum += (d[q] + d[q + 1]) / 2 - d[q + 2];
      for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) if (j >= 0 && j < W * H && !seen[j] && cand(j)) { seen[j] = 2; st[sp++] = j; } }
    if (wsum / comp.length > 1.2) for (const i of comp) { alpha[i] = 1; isMilk[i] = 1; }
  }
  /* the floor's shadow under the lifting pail (before the хөхүүр comes in):
     grey below the lowest solid, coloured pixel of each column goes */
  if (fade && fade.floor) for (let x = 0; x < W; x++) {
    let low = -1;
    for (let y = H - 1; y >= 0; y--) { const q = (y * W + x) * 4, R = d[q], G = d[q + 1], B = d[q + 2], mx = Math.max(R, G, B), mn = Math.min(R, G, B);
      if (alpha[y * W + x] > .5 && (mn < 150 || (mx - mn) / Math.max(1, mx) > .18)) { low = y; break; } }
    for (let y = Math.max(0, low + 1); y < H; y++) { const i = y * W + x, q = i * 4, R = d[q], G = d[q + 1], B = d[q + 2], mx = Math.max(R, G, B), mn = Math.min(R, G, B);
      if ((mx - mn) / Math.max(1, mx) < .15 && !isMilk[i]) alpha[i] = 0; }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, q = i * 4; let a = alpha[i];
    if (fade) { const e = Math.min(y, H - 1 - y) / fade.tb, s = Math.min(x, W - 1 - x) / fade.lr; a *= Math.min(1, e, s); }
    if (a <= 0) continue;
    const R = d[q], G = d[q + 1], B = d[q + 2], m = Math.min(R, G, B);
    if (isMilk[i]) { o[q] = R; o[q + 1] = G; o[q + 2] = B; }           /* milk: its own colour */
    else { const aw = m >= T1 ? 0 : m <= T0 ? 1 : (T1 - m) / (T1 - T0), un = ch => Math.max(0, Math.min(255, Math.round((ch - (1 - aw) * BG) / aw))); o[q] = un(R); o[q + 1] = un(G); o[q + 2] = un(B); }
    o[q + 3] = Math.round(a * 255);
  }
  return out;
}
function sharpen(ctx, w, h, amount, radius) {
  if (!amount) return;
  const src = ctx.getImageData(0, 0, w, h), d = src.data;
  const bc = document.createElement('canvas'); bc.width = w; bc.height = h; const bx = bc.getContext('2d', { willReadFrequently: true });
  bx.filter = 'blur(' + radius + 'px)'; bx.drawImage(ctx.canvas, 0, 0);
  const b = bx.getImageData(0, 0, w, h).data;
  for (let k = 0; k < d.length; k += 4) {
    if (d[k + 3] < 250 || b[k + 3] < 250) continue;
    for (let c = 0; c < 3; c++) { const v = d[k + c] + amount * (d[k + c] - b[k + c]); d[k + c] = v < 0 ? 0 : v > 255 ? 255 : v; }
  }
  ctx.putImageData(src, 0, 0);
}
const kc = document.createElement('canvas'); let kx;
/* jobs: [{ j, src }]; crop { x0, y0, w, h } in source px; out height outH */
window.render = async (jobs, crop, outH, amount = 0, radius = 1, fade = null, fmt = 'image/webp', q = .84) => {
  const res = [], ow = Math.round(outH * crop.w / crop.h);
  const oc = document.createElement('canvas'); oc.width = ow; oc.height = outH; const og = oc.getContext('2d', { willReadFrequently: true });
  for (const jb of jobs) {
    const im = await frame(jb.src);
    if (!kx) { kc.width = W; kc.height = H; kx = kc.getContext('2d', { willReadFrequently: true }); }
    kx.putImageData(key(im, jb.fade || fade), 0, 0);
    og.clearRect(0, 0, ow, outH); og.imageSmoothingEnabled = true; og.imageSmoothingQuality = 'high';
    og.drawImage(kc, crop.x0, crop.y0, crop.w, crop.h, 0, 0, ow, outH);
    sharpen(og, ow, outH, amount, radius);
    res.push({ j: jb.j, url: oc.toDataURL(fmt, q) });
  }
  return res;
};
window.bbox = async (f) => { const im = await frame(f), o = key(im, null).data; let l = W, r = -1, t = H, b = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (o[(y * W + x) * 4 + 3] > 8) { if (x < l) l = x; if (x > r) r = x; if (y < t) t = y; if (y > b) b = y; } return { l, r, t, b }; };
</script>
