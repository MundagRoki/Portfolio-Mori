<!doctype html><meta charset="utf-8"><body>
<script>
window.sheet = async (dir, list, tw, cols, bg) => {
  const ims = await Promise.all(list.map(j => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = dir + 'f' + String(j).padStart(3, '0') + '.webp'; })));
  const th = Math.round(tw * ims[0].height / ims[0].width), rows = Math.ceil(list.length / cols);
  const S = document.createElement('canvas'); S.width = cols * tw; S.height = rows * (th + 14); const G = S.getContext('2d');
  G.fillStyle = bg; G.fillRect(0, 0, S.width, S.height);
  ims.forEach((im, i) => { const x = (i % cols) * tw, y = Math.floor(i / cols) * (th + 14); if (im) G.drawImage(im, x, y, tw, th); G.fillStyle = '#6b5a45'; G.font = '11px sans-serif'; G.fillText('j' + list[i] + ' ' + (list[i] * 2.5) + '°', x + 4, y + th + 11); });
  return S.toDataURL('image/jpeg', .86);
};
</script>
