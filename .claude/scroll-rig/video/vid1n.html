<!doctype html><meta charset="utf-8"><body>
<video id="v" src="pail1.mp4" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v'), FPS = 24, N = 193;
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
let W, H, c, g;
async function frame(f) {
  await ready; if (!c) { W = v.videoWidth; H = v.videoHeight; c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d', { willReadFrequently: true }); }
  await seek((f + .5) / FPS); g.drawImage(v, 0, 0); return g.getImageData(0, 0, W, H);
}
window.frame = frame;
window.peek = async (f, x, y, w, h, s = 1, q = .9) => {
  const im = await frame(f); const k = document.createElement('canvas'); k.width = W; k.height = H; k.getContext('2d').putImageData(im, 0, 0);
  const o = document.createElement('canvas'); o.width = Math.round(w * s); o.height = Math.round(h * s);
  o.getContext('2d').drawImage(k, x, y, w, h, 0, 0, o.width, o.height); return o.toDataURL('image/jpeg', q);
};
/* per frame: the object's box, the hadag's (saturated blue) box, the bowl rim's
   extent in its top rows, how much touches each frame edge */
window.analyse = async (step = 1) => {
  const rows = [];
  for (let f = 0; f < N; f += step) {
    const im = await frame(f), d = im.data;
    let top = H, bot = 0, l = W, r = 0, bt = H, bb = 0, bl = W, br = 0, eL = 0, eR = 0, eB = 0, eT = 0, bx = 0, bn = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const k = (y * W + x) * 4, R = d[k], G = d[k + 1], B = d[k + 2], m = Math.min(R, G, B);
      if (m < 225) { if (y < top) top = y; if (y > bot) bot = y; if (x < l) l = x; if (x > r) r = x;
        if (x === 0) eL++; if (x === W - 1) eR++; if (y === H - 1) eB++; if (y === 0) eT++; }
      if (B - R > 60 && B > 120) { if (y < bt) bt = y; if (y > bb) bb = y; if (x < bl) bl = x; if (x > br) br = x; bx += x; bn++; }
    }
    /* the rim: object extent over rows top+8 .. top+30 */
    let rl = W, rr = 0;
    for (let y = top + 8; y <= top + 30; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4; if (Math.min(d[k], d[k + 1], d[k + 2]) < 225) { if (x < rl) rl = x; if (x > rr) rr = x; } }
    rows.push({ f, top, bot, l, r, bt, bb, bl, br, bc: +(bx / bn).toFixed(1), bn, rl, rr, eL, eR, eB, eT });
  }
  return rows;
};
</script>
<script>
/* the bowl, per frame: its widest row in the top 150 rows (the rim's major
   axis: centre and width), and a grey strip of its front wall for tracking */
const lum = (d, k) => .299 * d[k] + .587 * d[k + 1] + .114 * d[k + 2];
window.bowl = async (list) => {
  const out = [];
  for (const f of list) {
    const im = await frame(f), d = im.data;
    let top = H; for (let y = 0; y < H && top === H; y++) for (let x = 300; x < W - 300; x++) { const k = (y * W + x) * 4; if (Math.min(d[k], d[k + 1], d[k + 2]) < 200) { top = y; break; } }
    let best = { w: 0 };
    for (let y = top; y < top + 150; y++) {
      let l = -1, r = -1;
      for (let x = 200; x < W - 200; x++) { const k = (y * W + x) * 4; const R = d[k], G = d[k + 1], B = d[k + 2]; if (Math.min(R, G, B) < 200 && !(B - R > 60)) { if (l < 0) l = x; r = x; } }
      if (l >= 0 && r - l > best.w) best = { w: r - l, y, l, r };
    }
    out.push({ f, top, rimY: best.y, rimL: best.l, rimR: best.r, rimW: best.w, cx: (best.l + best.r) / 2 });
  }
  return out;
};
/* horizontal shift of the texture between consecutive frames, in a strip
   [y0,y1) at x in [cx-hw, cx+hw] around each frame's own bowl centre; SAD over
   shifts -30..30 with a parabola for the sub-pixel part */
window.flow = async (rows, dy0, dy1, hw) => {
  const res = []; let prev = null;
  for (const r of rows) {
    const im = await frame(r.f), d = im.data;
    const y0 = r.rimY + dy0, y1 = r.rimY + dy1, x0 = Math.round(r.cx) - hw - 40, x1 = Math.round(r.cx) + hw + 40;
    const S = { x0, w: x1 - x0, h: y1 - y0, v: new Float32Array((x1 - x0) * (y1 - y0)), cx: r.cx };
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) S.v[(y - y0) * S.w + (x - x0)] = lum(d, (y * W + x) * 4);
    /* high-pass: subtract a 15px box mean along x so shading does not steer it */
    const hp = new Float32Array(S.v.length);
    for (let y = 0; y < S.h; y++) { let acc = 0; const row = y * S.w;
      for (let x = 0; x < S.w; x++) { let s = 0, n = 0; for (let k = -7; k <= 7; k++) { const xx = x + k; if (xx >= 0 && xx < S.w) { s += S.v[row + xx]; n++; } } hp[row + x] = S.v[row + x] - s / n; } }
    S.hp = hp;
    if (prev && prev.h === S.h) {
      /* compare prev at bowl-relative x with cur at bowl-relative x - s (texture moves by s) */
      const sad = [];
      for (let s = -30; s <= 30; s++) {
        let acc = 0, n = 0;
        for (let y = 0; y < S.h; y++) for (let u = -hw; u <= hw; u++) {
          const xp = Math.round(prev.cx) + u - prev.x0, xc = Math.round(S.cx) + u + s - S.x0;
          if (xc < 0 || xc >= S.w || xp < 0 || xp >= prev.w) continue;
          acc += Math.abs(prev.hp[y * prev.w + xp] - S.hp[y * S.w + xc]); n++;
        }
        sad.push(acc / n);
      }
      let bi = 0; for (let i = 1; i < sad.length; i++) if (sad[i] < sad[bi]) bi = i;
      let sub = 0; if (bi > 0 && bi < sad.length - 1) { const a = sad[bi - 1], b = sad[bi], c = sad[bi + 1]; const den = a - 2 * b + c; if (den > 0) sub = .5 * (a - c) / den; }
      const sorted = [...sad].sort((a, b) => a - b);
      res.push({ f: r.f, shift: bi - 30 + sub, abs: Math.round(S.cx) - Math.round(prev.cx) + bi - 30 + sub, conf: +(sorted[Math.min(5, sorted.length - 1)] / sad[bi]).toFixed(2), sad: +sad[bi].toFixed(2) });
    }
    prev = S;
  }
  return res;
};
</script>
<script>
window.sheetAt = async (list, x, y, w, h, s, cols) => {
  const tw = Math.round(w * s), th = Math.round(h * s), rows = Math.ceil(list.length / cols);
  const S = document.createElement('canvas'); S.width = cols * tw; S.height = rows * (th + 16); const G = S.getContext('2d');
  G.fillStyle = '#fff'; G.fillRect(0, 0, S.width, S.height);
  for (let i = 0; i < list.length; i++) { const im = await frame(list[i]); const k = document.createElement('canvas'); k.width = W; k.height = H; k.getContext('2d').putImageData(im, 0, 0);
    G.drawImage(k, x, y, w, h, (i % cols) * tw, Math.floor(i / cols) * (th + 16), tw, th); G.fillStyle = '#c00'; G.font = '12px sans-serif'; G.fillText('f' + list[i], (i % cols) * tw + 4, Math.floor(i / cols) * (th + 16) + th + 12); }
  return S.toDataURL('image/jpeg', .85);
};
</script>
