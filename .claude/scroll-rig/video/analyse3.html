<!doctype html><meta charset="utf-8"><body>
<video id="v" src="step3.mp4" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v');
const ready = new Promise(r => v.readyState >= 1 ? r() : v.addEventListener('loadedmetadata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
const dark = (d, k) => Math.min(d[k], d[k+1], d[k+2]) < 215;
window.analyse = async () => {
  await ready;
  const FPS = 23.976, n = Math.round(v.duration * FPS), W = v.videoWidth, H = v.videoHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  const rows = [];
  for (let i = 0; i < n; i++) {
    await seek((i + .5) / FPS); g.drawImage(v, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    /* the pole where it leaves the top edge: its dark run in rows 2 and 60 */
    const run = y => { let a = -1, b = -1; for (let x = 0; x < W; x++) if (dark(d, (y * W + x) * 4)) { if (a < 0) a = x; b = x; } return a < 0 ? null : [a, b]; };
    const r0 = run(2), r1 = run(60), r2 = run(120);
    /* the crossbar band: first row (below 140) whose dark extent is much wider than the pole */
    let barY = -1, barL = 0, barR = 0;
    for (let y = 140; y < H * .4; y += 2) { const r = run(y); if (r && r[1] - r[0] > 160) { barY = y; barL = r[0]; barR = r[1]; break; } }
    /* bar length a little below the top of the bar (not the pole) */
    let bl = W, br = 0; if (barY > 0) { const yb = barY + 14; for (let x = 0; x < W; x++) if (dark(d, (yb * W + x) * 4)) { if (x < bl) bl = x; if (x > br) br = x; } }
    /* body: silhouette below the bar, for the width and centre of mass */
    let top = H, bot = 0, sx = 0, sw = 0, wl = W, wr = 0; const ym = Math.round(H * .66);
    for (let y = Math.max(0, barY); y < H; y += 3) for (let x = 0; x < W; x += 3) if (dark(d, (y * W + x) * 4)) { if (y > bot) bot = y; sx += x; sw++; }
    for (let x = 0; x < W; x++) if (dark(d, (ym * W + x) * 4)) { if (x < wl) wl = x; if (x > wr) wr = x; }
    rows.push({ i, pole0: r0, pole60: r1, pole120: r2, barY, bar: barY > 0 ? br - bl : 0, bodyW: wr - wl, massC: sw ? sx / sw : W / 2, bot });
  }
  return { n, W, H, rows };
};
</script>
