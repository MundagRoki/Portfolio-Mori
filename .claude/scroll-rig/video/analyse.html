<!doctype html><meta charset="utf-8"><body>
<video id="v" src="step1.mp4" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v');
const ready = new Promise(r => v.readyState >= 1 ? r() : v.addEventListener('loadedmetadata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
window.analyse = async () => {
  await ready;
  const FPS = 23.976, n = Math.round(v.duration * FPS), W = 360, H = 360;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  const rows = [], thumbs = [];
  for (let i = 0; i < n; i++) {
    await seek((i + .5) / FPS);
    g.drawImage(v, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data;
    let top = H, bot = 0, l = W, r = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4; if (Math.min(d[k], d[k+1], d[k+2]) < 225) { if (y < top) top = y; if (y > bot) bot = y; if (x < l) l = x; if (x > r) r = x; } }
    /* ears: wood-coloured pixels (not the black rope) in the top 14% of the object */
    const band = Math.round(top + (bot - top) * .14);
    const colHit = new Array(W).fill(0);
    for (let y = top; y < band; y++) for (let x = 0; x < W; x++) { const k = (y * W + x) * 4, R = d[k], G = d[k+1], B = d[k+2];
      if (Math.min(R, G, B) < 225 && R > 90 && R > B + 25) colHit[x]++; }
    const blobs = []; let s = -1;
    for (let x = 0; x <= W; x++) { const on = x < W && colHit[x] > 1; if (on && s < 0) s = x; if (!on && s >= 0) { if (x - s >= 3) blobs.push([s, x - 1]); s = -1; } }
    const centers = blobs.map(b => (b[0] + b[1]) / 2);
    const sep = centers.length >= 2 ? centers[centers.length - 1] - centers[0] : 0;
    /* base centre, a few px above the bottom */
    let bl = W, br = 0; for (let x = 0; x < W; x++) { const k = ((bot - 4) * W + x) * 4; if (Math.min(d[k], d[k+1], d[k+2]) < 225) { if (x < bl) bl = x; if (x > br) br = x; } }
    /* plaque: brightest gold-ish blob in the upper body centre third */
    let gold = 0; const y0 = Math.round(top + (bot - top) * .18), y1 = Math.round(top + (bot - top) * .36);
    for (let y = y0; y < y1; y++) for (let x = Math.round(W * .38); x < Math.round(W * .62); x++) { const k = (y * W + x) * 4, R = d[k], G = d[k+1], B = d[k+2]; if (R > 170 && G > 130 && B < 110 && R - B > 90) gold++; }
    rows.push({ i, top, bot, l, r, blobs: blobs.length, sep, bodyW: br - bl, baseC: (bl + br) / 2, gold });
    /* 48x48 grey thumbnail for matching */
    const t = document.createElement('canvas'); t.width = t.height = 48; const tg = t.getContext('2d', { willReadFrequently: true }); tg.drawImage(c, 0, 0, 48, 48);
    const td = tg.getImageData(0, 0, 48, 48).data; const gray = []; for (let k = 0; k < td.length; k += 4) gray.push((td[k] + td[k+1] + td[k+2]) / 3); thumbs.push(gray);
  }
  const diff = (a, b) => { let s = 0; for (let k = 0; k < a.length; k++) s += Math.abs(a[k] - b[k]); return s / a.length; };
  /* best splice: a frame late in the good first part matched to one in the clean last part */
  let best = null;
  for (let a = 95; a <= 125; a++) for (let b = 140; b <= 165; b++) { const dd = diff(thumbs[a], thumbs[b]); if (!best || dd < best.d) best = { a, b, d: +dd.toFixed(2) }; }
  const loop = +diff(thumbs[0], thumbs[n - 1]).toFixed(2);
  const neigh = []; for (let k = 1; k < n; k++) neigh.push(diff(thumbs[k - 1], thumbs[k])); neigh.sort((x, y) => x - y);
  return { n, rows, best, loop, neighMedian: +neigh[neigh.length >> 1].toFixed(2) };
};
</script>
