<!doctype html><meta charset="utf-8"><body>
<video id="v" src="pull.mp4" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v'), FPS = 24;
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
const dark = (d, k) => Math.min(d[k], d[k+1], d[k+2]) < 215;
window.analyse = async () => {
  await ready; const W = v.videoWidth, H = v.videoHeight, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d', { willReadFrequently: true });
  const rows = [];
  for (let f = 0; f < 193; f++) {
    await seek((f + .5) / FPS); g.drawImage(v, 0, 0); const d = g.getImageData(0, 0, W, H).data;
    /* the pole at the top edge: the dark run on row 2, then the run near it on row 30 */
    const runNear = (y, x0, x1) => { let a = -1, b = -1; for (let x = Math.max(0, x0); x < Math.min(W, x1); x++) if (dark(d, (y * W + x) * 4)) { if (a < 0) a = x; b = x; } return a < 0 ? null : [a, b]; };
    const r2 = runNear(2, 0, W), r30 = r2 ? runNear(30, r2[0] - 60, r2[1] + 60) : null;
    /* the head: pale warm wood (the disc is lighter than the pole and the leather) */
    let hx = 0, hy = 0, hn = 0;
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) { const k = (y * W + x) * 4, R = d[k], G = d[k+1], B = d[k+2];
      if (R > 175 && G > 140 && B > 95 && R - B > 35 && R - B < 110 && Math.min(R, G, B) < 222) { hx += x; hy += y; hn++; } }
    rows.push({ f, r2, r30, head: hn > 60 ? [Math.round(hx / hn), Math.round(hy / hn), hn] : null });
  }
  return rows;
};
</script>
