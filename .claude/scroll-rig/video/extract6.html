<!doctype html><meta charset="utf-8"><body>
<video id="v" src="step6.mp4" muted playsinline preload="auto"></video>
<script>
/* Step 6: the bowl of airag on its хадаг. The video's bowl sits off the
   turntable's centre, so each frame is held on the bowl itself (its rim's
   centre, row and width, from plan6.json) rather than a fixed axis; the
   turntable plate (fixed in the frame) is keyed out wherever it is not
   bowl and not хадаг blue; the airag inside the rim, near white, is kept
   solid; and where the хадаг's fringe runs off the frame edge it fades. */
const v = document.getElementById('v'), FPS = 24;
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
let W, H, c, g;
async function frame(f) {
  await ready; if (!c) { W = v.videoWidth; H = v.videoHeight; c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d', { willReadFrequently: true }); }
  await seek((f + .5) / FPS); g.drawImage(v, 0, 0); return g.getImageData(0, 0, W, H);
}
const T0 = 190, T1 = 226;                        /* min(r,g,b): at or below T0 object, at or above T1 paper */
const PZ = { x: 877.5, y: 850, a: 485, up: 215, dn: 180 };   /* the plate, with a margin (source px; it never moves) */
const ZB = { x0: 385, x1: 1370, y0: 630, y1: 1036 };
let P = null;                                    /* { frames: {src: {cx, rimY, rimW, top, l, r}}, ref: {cx, rimY, rimW}, prof: [...] } */
window.setPlan = p => { P = p; return Object.keys(p.frames).length; };
function inPlate(x, y) { const dx = (x - PZ.x) / PZ.a, dy = (y - PZ.y) / (y < PZ.y ? PZ.up : PZ.dn); return dx * dx + dy * dy <= 1; }
/* the keyed frame at source resolution */
function key(im, p) {
  const d = im.data, out = new ImageData(W, H), o = out.data;
  const k = p.rimW / P.ref.rimW, R0 = P.prof[0], bRim = (p.rimY - p.top) / k, prof = P.prof;
  /* хадаг blue inside the plate's box, and its box sums, so a grey fleck
     inside the хадаг (a crease, a sheen) stays with it */
  const zw = ZB.x1 - ZB.x0, zh = ZB.y1 - ZB.y0, hb = new Uint32Array((zw + 1) * (zh + 1));
  for (let y = 0; y < zh; y++) { let run = 0;
    for (let x = 0; x < zw; x++) { const q = ((y + ZB.y0) * W + x + ZB.x0) * 4, R = d[q], G = d[q + 1], B = d[q + 2];
      const mx = Math.max(R, G, B), s = mx ? (mx - Math.min(R, G, B)) / mx : 0;
      run += (B === mx && s >= .45 && mx >= 40) ? 1 : 0; hb[(y + 1) * (zw + 1) + x + 1] = hb[y * (zw + 1) + x + 1] + run; } }
  const frac = (x, y, r) => { const xa = Math.max(0, x - ZB.x0 - r), xb = Math.min(zw, x - ZB.x0 + r + 1), ya = Math.max(0, y - ZB.y0 - r), yb = Math.min(zh, y - ZB.y0 + r + 1);
    const S = hb[yb * (zw + 1) + xb] - hb[ya * (zw + 1) + xb] - hb[yb * (zw + 1) + xa] + hb[ya * (zw + 1) + xa]; return S / ((xb - xa) * (yb - ya)); };
  /* the fringe off the frame edge: fade toward that edge, by how far it reaches */
  const zL = Math.max(0, Math.min(1, (23 - p.l) / 23)) * 90, zR = Math.max(0, Math.min(1, (p.r - 1585) / 22)) * 90;
  /* cand: could be background (pale, or plate removed); solid: хадаг blue or bowl, for the islands' rims */
  const cand = new Uint8Array(W * H), solid = new Uint8Array(W * H);
  /* the lowest хадаг blue in each column: below it is floor, its shadow, or the plate */
  const lowBlue = new Int32Array(W).fill(-1);
  for (let x = 0; x < W; x++) for (let y = H - 1; y >= 0; y--) { const q = (y * W + x) * 4, R = d[q], G = d[q + 1], B = d[q + 2];
    const mx = Math.max(R, G, B); if (B === mx && mx >= 40 && (mx - Math.min(R, G, B)) / mx >= .45) { lowBlue[x] = y; break; } }
  for (let y = 0; y < H; y++) {
    const dyr = (y - p.rimY) / k;
    let hw = -1, core = -1;
    if (dyr < 0) { const t = -dyr / bRim; if (t < 1) hw = R0 * Math.sqrt(1 - t * t);
      /* inside the rim, well clear of its edge (the inner back wall shines near white) */
      const t2 = -dyr / (bRim - 7); if (t2 < 1) core = (R0 - 12) * Math.sqrt(1 - t2 * t2); }
    else if (dyr < prof.length) { hw = prof[Math.floor(dyr)]; if (dyr <= 250) core = hw - (dyr <= 200 ? 4 : 10); }
    /* the airag, near white, inside the rim: an ellipse a little below the
       rim's widest row (its surface sits lower), kept solid */
    const ta = (dyr - 30) / 66;
    const airW = Math.abs(ta) < 1 ? 338 * Math.sqrt(1 - ta * ta) : -1;
    for (let x = 0; x < W; x++) {
      const q = (y * W + x) * 4, R = d[q], G = d[q + 1], B = d[q + 2], m = Math.min(R, G, B);
      const dxr = Math.abs(x - p.cx) / k, i = y * W + x;
      const inB = hw >= 0 && dxr <= hw + 3;
      if (dxr <= core || dxr <= airW) { o[q] = R; o[q + 1] = G; o[q + 2] = B; o[q + 3] = 255; solid[i] = 1; continue; }
      const mx0 = Math.max(R, G, B), s0 = mx0 ? (mx0 - m) / mx0 : 0;
      if (inB || (B === mx0 && s0 >= .45 && mx0 >= 40)) solid[i] = 1;
      /* along the rim's own edge the silver shines up to near white: only paper-white is paper there */
      const rimBand = dyr < 40 && hw >= 0 && dxr <= hw + 2, t0 = rimBand ? 232 : T0, t1 = rimBand ? 248 : T1;
      let a = m >= t1 ? 0 : m <= t0 ? 1 : (t1 - m) / (t1 - t0);
      if (m > t0) cand[i] = 1;
      if (a <= 0) continue;
      const aw = a;
      if (!inB && ((x >= ZB.x0 && x < ZB.x1 && y >= ZB.y0 && y < ZB.y1 && inPlate(x, y)) || (lowBlue[x] >= 0 && y > lowBlue[x] + 1))) {
        let h = (B === mx0 && mx0 >= 40) ? Math.max(0, Math.min(1, (s0 - .28) / .17)) : 0;
        if (h < 1 && x >= ZB.x0 && x < ZB.x1 && y >= ZB.y0 && y < ZB.y1 && frac(x, y, 4) >= .6) h = 1;
        if (h < .5) cand[i] = 1;
        a *= h;
      }
      if (zL && x < zL) a *= x / zL;
      if (zR && W - 1 - x < zR) a *= (W - 1 - x) / zR;
      if (a <= 0) continue;
      const un = ch => Math.max(0, Math.min(255, Math.round((ch - (1 - aw) * 252) / aw)));
      o[q] = un(R); o[q + 1] = un(G); o[q + 2] = un(B); o[q + 3] = Math.round(a * 255);
    }
  }
  /* background is what the paper reaches from the frame's edge; a pale or
     grey patch shut inside the хадаг (a sheen, a crease) is хадаг, kept solid */
  const seen = new Uint8Array(W * H), st = new Int32Array(W * H); let sp = 0;
  const push = i => { if (cand[i] && !seen[i]) { seen[i] = 1; st[sp++] = i; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (sp) { const i = st[--sp], x = i % W; if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < W * (H - 1)) push(i + W); }
  let kept = 0;
  const comp = [];
  for (let i0 = 0; i0 < W * H; i0++) {
    if (!cand[i0] || seen[i0]) continue;
    comp.length = 0; seen[i0] = 2; st[0] = i0; sp = 1; let ring = 0, ringSolid = 0;
    while (sp) { const i = st[--sp], x = i % W; comp.push(i);
      for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) {
        if (j < 0 || j >= W * H) continue;
        if (cand[j]) { if (!seen[j]) { seen[j] = 2; st[sp++] = j; } }
        else { ring++; if (solid[j]) ringSolid++; } } }
    if (comp.length < 2500 || (comp.length < 6000 && ringSolid >= ring * .8)) {
      for (const i of comp) { const q = i * 4; o[q] = d[q]; o[q + 1] = d[q + 1]; o[q + 2] = d[q + 2]; o[q + 3] = 255; }
      kept += comp.length;
    }
  }
  out.kept = kept;
  return out;
}
const kc = document.createElement('canvas'); let kx;
async function keyed(src) {
  const im = await frame(src), p = P.frames[src];
  if (!kx) { kc.width = W; kc.height = H; kx = kc.getContext('2d', { willReadFrequently: true }); }
  const out = key(im, p); kx.putImageData(out, 0, 0); return { out, p };
}
/* the keyed object's box in the bowl's own frame (ref px) */
window.measure = async list => {
  const res = {};
  for (const src of list) {
    const { out, p } = await keyed(src), o = out.data, k = p.rimW / P.ref.rimW;
    let x0 = W, x1 = -1, y0 = H, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (o[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    res[src] = { X0: P.ref.cx + (x0 - p.cx) / k, X1: P.ref.cx + (x1 - p.cx) / k, Y0: P.ref.rimY + (y0 - p.rimY) / k, Y1: P.ref.rimY + (y1 - p.rimY) / k };
  }
  return res;
};
function sharpen(ctx, w, h, amount, radius) {
  if (!amount) return;
  const src = ctx.getImageData(0, 0, w, h), d = src.data;
  const bc = document.createElement('canvas'); bc.width = w; bc.height = h; const bx = bc.getContext('2d', { willReadFrequently: true });
  bx.filter = 'blur(' + radius + 'px)'; bx.drawImage(ctx.canvas, 0, 0);
  const b = bx.getImageData(0, 0, w, h).data;
  for (let k = 0; k < d.length; k += 4) {
    if (d[k + 3] < 250 || b[k + 3] < 250) continue;
    for (let c = 0; c < 3; c++) { const v = d[k + c] + amount * (d[k + c] - b[k + c]); d[k + c] = v < 0 ? 0 : v > 255 ? 255 : v; }
  }
  ctx.putImageData(src, 0, 0);
}
/* crop: { X0, Y0, w, h } in ref px, the bowl's axis at X0 + w/2 */
window.render = async (jobs, crop, outH, amount = 0, radius = 1, fmt = 'image/webp', q = .84) => {
  const res = [], o = outH / crop.h, ow = Math.round(crop.w * o);
  const oc = document.createElement('canvas'); oc.width = ow; oc.height = outH;
  const og = oc.getContext('2d', { willReadFrequently: true });
  for (const jb of jobs) {
    const { p } = await keyed(jb.src), k = p.rimW / P.ref.rimW, s = o / k;
    og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, ow, outH);
    og.imageSmoothingEnabled = true; og.imageSmoothingQuality = 'high';
    og.setTransform(s, 0, 0, s, (P.ref.cx - crop.X0) * o - p.cx * s, (P.ref.rimY - crop.Y0) * o - p.rimY * s);
    og.drawImage(kc, 0, 0);
    og.setTransform(1, 0, 0, 1, 0, 0);
    sharpen(og, ow, outH, amount, radius);
    /* the set's look (window.stylize, when loaded): colour and surface, alpha untouched */
    if (window.stylize) { const im = og.getImageData(0, 0, ow, outH); window.stylize(im, outH / 954); og.putImageData(im, 0, 0); }
    res.push({ j: jb.j, url: oc.toDataURL(fmt, q) });
  }
  return res;
};
</script>
