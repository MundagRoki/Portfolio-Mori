<!doctype html><meta charset="utf-8"><body>
<video id="v" src="step1.mp4" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v'), FPS = 23.976;
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
const seek = t => new Promise(r => { v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = t; });
let W, H, c, g;
async function frame(f) {
  await ready; if (!c) { W = v.videoWidth; H = v.videoHeight; c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d', { willReadFrequently: true }); }
  await seek((f + .5) / FPS); g.drawImage(v, 0, 0); return g.getImageData(0, 0, W, H);
}
const T0 = 190, T1 = 226;                 /* min(r,g,b) at or below T0 is pail, at or above T1 is paper-white background */
window.measure = async list => {
  const out = {};
  for (const f of list) {
    const im = await frame(f), d = im.data;
    let top = H, bot = 0, l = W, r = 0;
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) { const k = (y * W + x) * 4; if (Math.min(d[k], d[k+1], d[k+2]) < 225) { if (y < top) top = y; if (y > bot) bot = y; if (x < l) l = x; if (x > r) r = x; } }
    let bl = W, br = 0; const yb = bot - 10;
    for (let x = 0; x < W; x++) { const k = (yb * W + x) * 4; if (Math.min(d[k], d[k+1], d[k+2]) < 225) { if (x < bl) bl = x; if (x > br) br = x; } }
    out[f] = { top, bot, l, r, baseC: (bl + br) / 2 };
  }
  return out;
};
/* unsharp mask, inside the object only: where either the frame or its blur
   is not fully opaque the pixel is left alone, so the outline gets no halo */
function sharpen(ctx, w, h, amount, radius) {
  if (!amount) return;
  const src = ctx.getImageData(0, 0, w, h), d = src.data;
  const bc = document.createElement('canvas'); bc.width = w; bc.height = h; const bx = bc.getContext('2d', { willReadFrequently: true });
  bx.filter = 'blur(' + radius + 'px)'; bx.drawImage(ctx.canvas, 0, 0);
  const b = bx.getImageData(0, 0, w, h).data;
  for (let k = 0; k < d.length; k += 4) {
    if (d[k + 3] < 250 || b[k + 3] < 250) continue;
    for (let c = 0; c < 3; c++) { const v = d[k + c] + amount * (d[k + c] - b[k + c]); d[k + c] = v < 0 ? 0 : v > 255 ? 255 : v; }
  }
  ctx.putImageData(src, 0, 0);
}
window.render = async (jobs, crop, outH, amount = 0, radius = 1) => {
  const res = [];
  const oc = document.createElement('canvas'); const ow = Math.round(outH * crop.w / crop.h); oc.width = ow; oc.height = outH;
  const og = oc.getContext('2d', { willReadFrequently: true });
  const kc = document.createElement('canvas'); kc.width = crop.w; kc.height = crop.h; const kg = kc.getContext('2d');
  for (const jb of jobs) {
    const im = await frame(jb.src), d = im.data;
    const x0 = Math.round(jb.baseC - crop.w / 2), y0 = crop.top;         /* hold the base centre still */
    const cut = kg.createImageData(crop.w, crop.h), o = cut.data;
    for (let y = 0; y < crop.h; y++) { const sy = y0 + y; if (sy < 0 || sy >= H) continue;
      for (let x = 0; x < crop.w; x++) { const sx = x0 + x; if (sx < 0 || sx >= W) continue;
        const k = (sy * W + sx) * 4, q = (y * crop.w + x) * 4;
        const R = d[k], G = d[k+1], B = d[k+2], m = Math.min(R, G, B);
        const a = m >= T1 ? 0 : m <= T0 ? 1 : (T1 - m) / (T1 - T0);
        if (a <= 0) { o[q+3] = 0; continue; }
        /* take the white back out of edge pixels so there is no pale fringe on the paper */
        const un = ch => Math.max(0, Math.min(255, Math.round((ch - (1 - a) * 252) / a)));
        o[q] = un(R); o[q+1] = un(G); o[q+2] = un(B); o[q+3] = Math.round(a * 255);
      } }
    kg.putImageData(cut, 0, 0);
    og.clearRect(0, 0, ow, outH); og.imageSmoothingQuality = 'high'; og.drawImage(kc, 0, 0, ow, outH);
    sharpen(og, ow, outH, amount, radius);
    res.push({ j: jb.j, url: oc.toDataURL('image/webp', .84) });
  }
  return res;
};
</script>
