<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<defs>

<!-- ӨЛЗИЙ / ulzii — the endless knot.
     A wide loop and a tall loop, interlaced. The wide one is drawn whole;
     the tall one is drawn in two arcs with gaps at the top-left and
     bottom-right crossings, so the wide loop shows through there and the
     two genuinely weave. No knockout colour, so it works on any ground. -->
<symbol id="m-ulzii" viewBox="0 0 90 90">
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="butt">
    <path d="M20 30 H70 A10 10 0 0 1 80 40 V50 A10 10 0 0 1 70 60
             H20 A10 10 0 0 1 10 50 V40 A10 10 0 0 1 20 30 Z"/>
    <path d="M30 36 V70 A10 10 0 0 0 40 80 H50 A10 10 0 0 0 60 70 V66"/>
    <path d="M60 54 V20 A10 10 0 0 0 50 10 H40 A10 10 0 0 0 30 20 V24"/>
  </g>
</symbol>

<!-- ХАДГАН ХЭЭ / khadgan khee — the ceremonial scarf, drawn as ornament.
     Symmetrical about the centre: a shallow band that dips in the middle,
     a scrolled head at each end, and a wave falling from each head. -->
<symbol id="m-khadag" viewBox="0 0 200 96">
  <defs>
    <!-- ONE CURL, and the whole ornament is built from it — which is how
         üülen khee is actually constructed. A flat entry that becomes the
         cloud's top bump, then a turn down and a wind inward. Set closer
         together than the curl is wide, a row of them reads as one
         scalloped cloud instead of separate spirals. -->
    <path id="kh-curl" d="M0 7 C4 -1 14 -3 19 4 C24 11 21 21 13 22 C6 23 2 17 6 12 C9 8 14 10 13 14"/>

    <g id="kh-wing">
      <!-- the upper mass, riding in against the scarf -->
      <use href="#kh-curl" transform="translate(59 30) scale(0.95)"/>
      <use href="#kh-curl" transform="translate(46 28) scale(1.1)"/>
      <use href="#kh-curl" transform="translate(35 34) scale(0.86)"/>
      <!-- the lower mass, falling away below it and further out -->
      <use href="#kh-curl" transform="translate(44 56) scale(0.82)"/>
      <use href="#kh-curl" transform="translate(30 59) scale(1.0)"/>
      <use href="#kh-curl" transform="translate(19 69) scale(0.66)"/>
    </g>

    <!-- the scarf: nested arcs drawn from the centre outward, so the ends
         sweep up into the cloud instead of stopping dead. They fan apart
         across the sag and converge again where the cloud takes over. -->
    <g id="kh-scarf">
      <path d="M100 55   C90 55   83 50.5 74 42"/>
      <path d="M100 58   C90 58   84 53   77 45"/>
      <path d="M100 60.5 C91 60.5 86 55.5 80 48"/>
      <path d="M100 63   C92 63   88 58.5 83 51.5"/>
    </g>
  </defs>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.4">
      <use href="#kh-wing"/>
      <use href="#kh-wing" transform="translate(200 0) scale(-1 1)"/>
    </g>
    <g stroke-width="1.9">
      <use href="#kh-scarf"/>
      <use href="#kh-scarf" transform="translate(200 0) scale(-1 1)"/>
    </g>
  </g>
</symbol>

<!-- АЛХАН ХЭЭ / alkhan khee — the hammer meander. One tile, meant to be
     repeated along a rule. Never stretched. -->
<symbol id="m-alkhan" viewBox="0 0 40 16">
  <path d="M-2 13 H6 V3 H26 V9 H16 V13 H42" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
</symbol>

<!-- ЭВЭР УГАЛЗ / ever ugalz — the ram's-horn spiral. Two horns curling out
     from a shared root. -->
<symbol id="m-ever" viewBox="0 0 64 40">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <path d="M32 36 C32 22 26 14 18 14 C10 14 6 20 8 26 C10 31 17 31 18 25"/>
    <path d="M32 36 C32 22 38 14 46 14 C54 14 58 20 56 26 C54 31 47 31 46 25"/>
  </g>
</symbol>

<!-- УУЛАН ХЭЭ / uulan khee — the stepped mountain. -->
<symbol id="m-uul" viewBox="0 0 64 28">
  <path d="M2 26 H14 V18 H22 V10 H30 V2 H34 V10 H42 V18 H50 V26 H62"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linejoin="miter" stroke-linecap="butt"/>
</symbol>

<!-- ҮҮЛЭН ХЭЭ / üülen khee — the cloud scroll. -->
<symbol id="m-uulen" viewBox="0 0 76 36">
  <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
    <path d="M4 31 C4 17 13 8 24 8 C33 8 38 15 35 21 C32 26 25 25 25 19"/>
    <path d="M34 31 C34 17 43 8 54 8 C63 8 68 15 65 21 C62 26 55 25 55 19"/>
  </g>
</symbol>

</defs>
</svg>
