<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
<defs>
  <path id="t" d="M10 26
    C10 9 25 2 35 9 C41 13 45 16 50 16 C55 16 59 13 65 9
    C75 2 90 9 90 26
    C90 44 86 60 82 76 C79 92 77 107 72 115
    C68 121 60 119 58 109 C55 94 54 80 50 80
    C46 80 45 94 42 109 C40 119 32 121 28 115
    C23 107 21 92 18 76 C14 60 10 44 10 26 Z"/>
  <!-- One scatter on a jittered 3x3 grid, each tooth rotated about its own
       centre so nothing collides. The tile draws it nine times at plus and
       minus 260 so shapes crossing an edge return on the opposite side —
       a true seamless repeat. Opacity is on the parent group, not per shape,
       so the group composites once and overlaps never darken. Drawn as clinic
       blue outlines (the stroke is in the tooth's own units, before the 0.4
       scale, so it lands near 1.7px). -->
  <g id="s">
    <g transform="translate(42.7 44.0) rotate(68) scale(0.407) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(130.1 44.3) rotate(-50) scale(0.411) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(218.3 46.8) rotate(-65) scale(0.390) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(38.4 133.7) rotate(31) scale(0.364) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(135.8 135.6) rotate(25) scale(0.422) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(212.6 124.2) rotate(5) scale(0.366) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(39.6 213.6) rotate(-75) scale(0.406) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(129.3 220.8) rotate(3) scale(0.424) translate(-50 -60)"><use href="#t"/></g>
    <g transform="translate(216.7 218.6) rotate(-7) scale(0.388) translate(-50 -60)"><use href="#t"/></g>
  </g>
</defs>
<g fill="none" stroke="#3b73b0" stroke-width="4.2" stroke-linejoin="round" opacity=".34">
  <use href="#s" x="-260" y="-260"/><use href="#s" y="-260"/><use href="#s" x="260" y="-260"/>
  <use href="#s" x="-260"/>        <use href="#s"/>         <use href="#s" x="260"/>
  <use href="#s" x="-260" y="260"/><use href="#s" y="260"/> <use href="#s" x="260" y="260"/>
</g>
</svg>
